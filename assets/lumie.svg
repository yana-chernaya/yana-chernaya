<svg xmlns="http://www.w3.org/2000/svg" width="820" height="240" viewBox="0 0 820 240">
<title>Lumie</title>
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#121029"/><stop offset=".55" stop-color="#271d49"/><stop offset="1" stop-color="#5e3357"/>
</linearGradient>
<radialGradient id="g" cx="1" cy="0" r=".9"><stop offset="0" stop-color="#ffb38a" stop-opacity=".35"/><stop offset="1" stop-color="#ffb38a" stop-opacity="0"/></radialGradient>
<clipPath id="r"><rect width="820" height="240" rx="20"/></clipPath>
