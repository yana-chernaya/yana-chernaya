<svg xmlns="http://www.w3.org/2000/svg" width="410" height="240" viewBox="0 0 410 240"><g transform="translate(10 0)">
<title>Notes</title>
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#121029"/><stop offset=".55" stop-color="#271d49"/><stop offset="1" stop-color="#5e3357"/>
</linearGradient>
<radialGradient id="g" cx="1" cy="0" r=".9"><stop offset="0" stop-color="#8fe3c8" stop-opacity=".35"/><stop offset="1" stop-color="#8fe3c8" stop-opacity="0"/></radialGradient>
<clipPath id="r"><rect width="400" height="240" rx="20"/></clipPath>
</defs>
<style>
.st{fill:#fff;animation:tw 4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:.95}}
.in{animation:in 1.4s ease both}
.in2{animation:in 1.4s .5s ease both}
.in3{animation:in 1.4s 1s ease both}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.fl{animation:fl 7s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.heart{animation:hr 4s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes hr{0%,50%{opacity:0;transform:translateY(0) scale(.5)}60%{opacity:1;transform:translateY(-4px) scale(1.15)}100%{opacity:0;transform:translateY(-45px) scale(.9)}}
.pulse{animation:pu 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pu{0%,100%{transform:scale(.85);opacity:.7}50%{transform:scale(1.1);opacity:1}}
</style>
<g clip-path="url(#r)">
<rect width="400" height="240" fill="url(#sky)"/>
<rect width="400" height="240" fill="url(#g)"/>
<circle class="st" cx="381" cy="64" r="0.7" style="animation-delay:0.6s;animation-duration:4.1s"/>
<circle class="st" cx="220" cy="17" r="1.1" style="animation-delay:0.9s;animation-duration:5.3s"/>
<circle class="st" cx="239" cy="10" r="0.8" style="animation-delay:1.8s;animation-duration:5.4s"/>
<circle class="st" cx="103" cy="223" r="1.1" style="animation-delay:1.2s;animation-duration:2.6s"/>
<circle class="st" cx="95" cy="16" r="0.8" style="animation-delay:1.7s;animation-duration:4.5s"/>
<circle class="st" cx="87" cy="225" r="0.8" style="animation-delay:3.3s;animation-duration:3.2s"/>
<circle class="st" cx="121" cy="221" r="0.9" style="animation-delay:0.7s;animation-duration:3.2s"/>
<circle class="st" cx="382" cy="40" r="0.6" style="animation-delay:0.2s;animation-duration:3.7s"/>
<circle class="st" cx="289" cy="231" r="1.3" style="animation-delay:1.3s;animation-duration:3.1s"/>
<circle class="st" cx="9" cy="71" r="0.8" style="animation-delay:3.8s;animation-duration:2.9s"/>
<circle class="st" cx="352" cy="15" r="0.9" style="animation-delay:3.2s;animation-duration:4.8s"/>
<circle class="st" cx="24" cy="16" r="0.6" style="animation-delay:3.7s;animation-duration:3.3s"/>
<circle class="st" cx="9" cy="177" r="1.2" style="animation-delay:2.5s;animation-duration:5.3s"/>
<circle class="st" cx="17" cy="60" r="0.9" style="animation-delay:3.8s;animation-duration:5.4s"/>

<g class="in">
<text x="36" y="46" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="13" letter-spacing="3" fill="#8fe3c8">03</text>
<text x="36" y="94" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="42" fill="#fdf3ea">Notes</text>
</g>
<g class="in2">
<text x="36" y="132" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" fill="#e4d9ef">Text and images, in any order.</text>
<text x="36" y="157" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" fill="#e4d9ef">Search, pin, keep what matters.</text>
</g>
<g class="in3"><rect x="36" y="190" width="77" height="26" rx="13" fill="#8fe3c8" fill-opacity=".12" stroke="#8fe3c8" stroke-opacity=".45"/><text x="74" y="207.5" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="13" fill="#8fe3c8">Compose</text><rect x="121" y="190" width="53" height="26" rx="13" fill="#8fe3c8" fill-opacity=".12" stroke="#8fe3c8" stroke-opacity=".45"/><text x="147" y="207.5" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="13" fill="#8fe3c8">Hilt</text><rect x="182" y="190" width="53" height="26" rx="13" fill="#8fe3c8" fill-opacity=".12" stroke="#8fe3c8" stroke-opacity=".45"/><text x="208" y="207.5" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="13" fill="#8fe3c8">Room</text><rect x="243" y="190" width="53" height="26" rx="13" fill="#8fe3c8" fill-opacity=".12" stroke="#8fe3c8" stroke-opacity=".45"/><text x="270" y="207.5" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="13" fill="#8fe3c8">Coil</text></g>
<g transform="translate(330 54)"><circle r="26" fill="#8fe3c8" fill-opacity=".14" stroke="#8fe3c8" stroke-opacity=".5"/><path d="M-11,-13 h15 l7,7 v19 h-22z" fill="none" stroke="#8fe3c8" stroke-width="2.5" stroke-linejoin="round"/><path d="M4,-13 v7 h7" fill="none" stroke="#8fe3c8" stroke-width="2.5" stroke-linejoin="round"/></g>
</g>
<rect x="1" y="1" width="398" height="238" rx="19" fill="none" stroke="#8fe3c8" stroke-opacity=".25"/>
</g></svg>